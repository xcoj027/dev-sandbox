buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.guardsquare:proguard-gradle:7.10.0'
	}
}

plugins {
	id 'application'
	id 'jacoco'
}

group = 'com.dixon'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
}

application {
	mainClass = 'com.dixon.sandbox.DevSandboxApp'
	applicationName = 'dev-sandbox'
}

tasks.named('jar') {
	destinationDirectory = layout.buildDirectory.dir('raw')
	archiveFileName = 'dev-sandbox-raw.jar'
	manifest {
		attributes(
			'Main-Class': 'com.dixon.sandbox.DevSandboxApp',
			'Implementation-Title': 'Dev Sandbox',
			'Implementation-Vendor': 'TNQ MEDIA',
			'Implementation-Version': project.version
		)
	}
}

tasks.register('obfuscate', proguard.gradle.ProGuardTask) {
	dependsOn tasks.named('jar')
	injars tasks.named('jar').get().archiveFile
	outjars layout.buildDirectory.file('libs/dev-sandbox.jar')

	def javaHome = System.getProperty('java.home')
	if (new File("${javaHome}/jmods").exists()) {
		libraryjars "${javaHome}/jmods"
	} else {
		libraryjars "${javaHome}/lib/rt.jar"
	}

	configuration file('proguard.pro')
}

tasks.named('assemble') {
	dependsOn tasks.named('obfuscate')
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.27.3'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestReport')
}
